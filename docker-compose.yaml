services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aerotrace-timescaledb
    environment:
      POSTGRES_USER: ${AEROTRACE_DB_USERNAME}
      POSTGRES_PASSWORD: ${AEROTRACE_DB_PASSWORD}
      POSTGRES_DB: ${AEROTRACE_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - aerotrace-db-data:/var/lib/postgresql/data
    networks:
      - aerotrace-network
    restart: unless-stopped

  otel-storage-init:
    image: alpine:3.22
    container_name: aerotrace-otel-storage-init
    command:
      - sh
      - -c
      - >
        mkdir -p
        /var/lib/otelcol/storage
        /var/lib/otelcol/compaction
        &&
        chown -R 10001:10001
        /var/lib/otelcol
    volumes:
      - aerotrace-otelcol-data:/var/lib/otelcol
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: aerotrace-otel-collector
    env_file:
      - ./otel-collector.env
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - aerotrace-otelcol-data:/var/lib/otelcol
    ports:
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:8888:8888"
    depends_on:
      timescaledb:
        condition: service_started
      otel-storage-init:
        condition: service_completed_successfully
    networks:
      - aerotrace-network
    restart: unless-stopped

volumes:
  aerotrace-db-data:

  aerotrace-otelcol-data:
    name: aerotrace-otelcol-data

networks:
  aerotrace-network:
    driver: bridge