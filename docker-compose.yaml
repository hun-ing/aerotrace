services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aerotrace-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aerotrace     # 접속할 데이터베이스 이름
    ports:
      - "5432:5432"
    volumes:
      # 앞서 논의한 '네임드 볼륨' 방식. OS에 상관없이 도커가 안전하게 데이터를 영구 보관합니다.
      - aerotrace-db-data:/var/lib/postgresql/data
    networks:
      - aerotrace-network
    restart: unless-stopped

  otel-storage-init:
    image: alpine:3.22
    container_name: aerotrace-otel-storage-init
    command:
      - sh
      - -c
      - >
        mkdir -p /var/lib/otelcol/storage
        /var/lib/otelcol/compaction
        &&
        chown -R 10001:10001 /var/lib/otelcol
    volumes:
      - aerotrace-otelcol-data:/var/lib/otelcol
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: aerotrace-otel-collector
    env_file:
      - ./otel-collector.env
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - aerotrace-otelcol-data:/var/lib/otelcol
    ports:
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:8888:8888"
    depends_on:
      timescaledb:
        condition: service_started
      otel-storage-init:
        condition: service_completed_successfully
    networks:
      - aerotrace-network
    restart: unless-stopped

# 볼륨 선언 (윈도우/우분투 이식성 확보)
volumes:
  aerotrace-db-data:

  aerotrace-otelcol-data:
    name: aerotrace-otelcol-data

# 서비스 간 통신을 격리하고 보호하기 위한 전용 네트워크
networks:
  aerotrace-network:
    driver: bridge