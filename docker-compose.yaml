version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aerotrace-timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aerotrace     # 접속할 데이터베이스 이름
    ports:
      - "5432:5432"
    volumes:
      # 앞서 논의한 '네임드 볼륨' 방식. OS에 상관없이 도커가 안전하게 데이터를 영구 보관합니다.
      - aerotrace-db-data:/var/lib/postgresql/data
    networks:
      - aerotrace-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: aerotrace-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      # 로컬에 작성할 설정 파일을 컨테이너 내부로 맵핑(읽기 전용)
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (앱에서 데이터를 쏠 포트)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - timescaledb
    networks:
      - aerotrace-network
    restart: unless-stopped

# 볼륨 선언 (윈도우/우분투 이식성 확보)
volumes:
  aerotrace-db-data:

# 서비스 간 통신을 격리하고 보호하기 위한 전용 네트워크
networks:
  aerotrace-network:
    driver: bridge