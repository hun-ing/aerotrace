name: Notification Outbox Tests

on:
  pull_request:
    paths:
      - ".github/workflows/notification-outbox-tests.yml"
      - "scripts/process-notification-outbox.py"
      - "tests/test_notification_outbox.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/notification-outbox-tests.yml"
      - "scripts/process-notification-outbox.py"
      - "tests/test_notification_outbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-outbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notification-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run notification outbox regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
