name: Notification Pipeline Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/notification-outbox-tests.yml"
      - "receiver/cloudflare-slack/**"
      - "scripts/process-notification-outbox.py"
      - "tests/test_notification_outbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notification-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run notification outbox regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

  cloudflare-slack-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: receiver/cloudflare-slack

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run receiver tests
        run: npm test

      - name: Check receiver source syntax
        run: npm run check

      - name: Validate Worker bundle and bindings
        run: npm run deploy:dry-run

      - name: Validate fresh local D1 migration
        run: npm run db:migrate:local
