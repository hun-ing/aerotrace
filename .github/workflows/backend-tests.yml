name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aerotrace-ci-only
          POSTGRES_DB: aerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aerotrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AEROTRACE_DB_URL: >-
        jdbc:postgresql://localhost:5432/aerotrace?reWriteBatchedInserts=true
      AEROTRACE_DB_USERNAME: postgres
      AEROTRACE_DB_PASSWORD: aerotrace-ci-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Backend tests
        run: bash ./gradlew test --no-daemon

      - name: Verify Project API Key provisioning task
        run: >-
          bash ./gradlew
          help
          --task provisionProjectApiKey
          --no-daemon
