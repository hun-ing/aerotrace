name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aerotrace-ci-only
          POSTGRES_DB: aerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aerotrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AEROTRACE_DB_URL: >-
        jdbc:postgresql://localhost:5432/aerotrace?reWriteBatchedInserts=true
      AEROTRACE_DB_USERNAME: postgres
      AEROTRACE_DB_PASSWORD: aerotrace-ci-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Backend tests
        run: bash ./gradlew test --no-daemon

      - name: Verify Project API Key provisioning and lifecycle
        env:
          AEROTRACE_PROVISION_TENANT_NAME: AeroTrace CI
          AEROTRACE_PROVISION_TENANT_SLUG: aerotrace-ci
          AEROTRACE_PROVISION_PROJECT_NAME: AeroTrace CI
          AEROTRACE_PROVISION_PROJECT_SLUG: aerotrace-ci
          AEROTRACE_PROVISION_API_KEY_NAME: ci-runtime
          AEROTRACE_PROVISION_API_KEY_EXPIRATION_DAYS: "1"
        run: |
          set -euo pipefail
          umask 077

          output_file="$(mktemp)"
          replacement_file="$(mktemp)"
          list_file="$(mktemp)"
          revoke_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$output_file" "$replacement_file" "$list_file" "$revoke_file" "$error_file"' EXIT

          bash ./gradlew \
            provisionProjectApiKey \
            --no-daemon \
            >"$output_file"

          grep -Eq \
            '^AEROTRACE_PROVISIONED_TENANT_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_PROJECT_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_API_KEY_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_KEY_ID=[A-Za-z0-9_-]{16}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_EXPIRES_AT=.+$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_API_KEY=atr_[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{43}$' \
            "$output_file"

          if bash ./gradlew \
            provisionProjectApiKey \
            --no-daemon \
            >/dev/null \
            2>"$error_file"; then
            echo 'duplicate active API Key was unexpectedly issued' >&2
            exit 1
          fi

          grep -Fq \
            'An active API Key already exists with the requested name' \
            "$error_file"

          api_key_id="$(
            sed -n \
              's/^AEROTRACE_PROVISIONED_API_KEY_ID=//p' \
              "$output_file"
          )"

          if [[ ! "$api_key_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo 'provisioned API Key row ID was invalid' >&2
            exit 1
          fi

          AEROTRACE_API_KEY_ACTION=list \
          AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
            bash ./gradlew \
              manageProjectApiKeys \
              --no-daemon \
              >"$list_file"

          grep -Fqx \
            'AEROTRACE_API_KEY_LIST_RESULT=OK' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_COUNT=1' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_ACTIVE_COUNT=1' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_1_NAME_BASE64URL=Y2ktcnVudGltZQ' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_1_STATUS=ACTIVE' \
            "$list_file"

          if \
            AEROTRACE_API_KEY_ACTION=issue \
            AEROTRACE_API_KEY_TENANT_SLUG=missing-tenant \
            AEROTRACE_API_KEY_PROJECT_SLUG=missing-project \
            AEROTRACE_API_KEY_NAME=must-not-be-issued \
            AEROTRACE_API_KEY_EXPIRATION_DAYS=1 \
              bash ./gradlew \
                manageProjectApiKeys \
                --no-daemon \
                >/dev/null \
                2>"$error_file"; then
            echo 'API Key was unexpectedly issued for a missing project' >&2
            exit 1
          fi

          grep -Fq \
            'The requested tenant/project was not found' \
            "$error_file"

          if \
            AEROTRACE_API_KEY_ACTION=revoke \
            AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
            AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
            AEROTRACE_API_KEY_ID="$api_key_id" \
            AEROTRACE_API_KEY_EXPECTED_NAME=ci-runtime \
            AEROTRACE_API_KEY_CONFIRM_REVOKE=REVOKE \
              bash ./gradlew \
                manageProjectApiKeys \
                --no-daemon \
                >/dev/null \
                2>"$error_file"; then
            echo 'last active API Key was unexpectedly revoked' >&2
            exit 1
          fi

          grep -Fq \
            'Refusing to revoke the last active API Key.' \
            "$error_file"

          AEROTRACE_API_KEY_ACTION=issue \
          AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_NAME=ci-runtime-next \
          AEROTRACE_API_KEY_EXPIRATION_DAYS=1 \
            bash ./gradlew \
              manageProjectApiKeys \
              --no-daemon \
              >"$replacement_file"

          grep -Eq \
            '^AEROTRACE_API_KEY=atr_[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{43}$' \
            "$replacement_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_ISSUE_RESULT=ISSUED' \
            "$replacement_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_ISSUED_NAME_BASE64URL=Y2ktcnVudGltZS1uZXh0' \
            "$replacement_file"

          if grep -Eiq \
            'secret_hash|(^|_)KEY_ID=' \
            "$replacement_file"; then
            echo 'issue output exposed stored credential material' >&2
            exit 1
          fi

          AEROTRACE_API_KEY_ACTION=revoke \
          AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_ID="$api_key_id" \
          AEROTRACE_API_KEY_EXPECTED_NAME=ci-runtime \
          AEROTRACE_API_KEY_CONFIRM_REVOKE=REVOKE \
            bash ./gradlew \
              manageProjectApiKeys \
              --no-daemon \
              >"$revoke_file"

          grep -Fqx \
            'AEROTRACE_API_KEY_REVOKE_RESULT=REVOKED' \
            "$revoke_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_ACTIVE_COUNT_AFTER=1' \
            "$revoke_file"

          AEROTRACE_API_KEY_ACTION=revoke \
          AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_ID="$api_key_id" \
          AEROTRACE_API_KEY_EXPECTED_NAME=ci-runtime \
          AEROTRACE_API_KEY_CONFIRM_REVOKE=REVOKE \
            bash ./gradlew \
              manageProjectApiKeys \
              --no-daemon \
              >"$revoke_file"

          grep -Fqx \
            'AEROTRACE_API_KEY_REVOKE_RESULT=ALREADY_REVOKED' \
            "$revoke_file"

          AEROTRACE_API_KEY_ACTION=list \
          AEROTRACE_API_KEY_TENANT_SLUG=aerotrace-ci \
          AEROTRACE_API_KEY_PROJECT_SLUG=aerotrace-ci \
            bash ./gradlew \
              manageProjectApiKeys \
              --no-daemon \
              >"$list_file"

          grep -Fqx \
            'AEROTRACE_API_KEY_COUNT=2' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_ACTIVE_COUNT=1' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_1_NAME_BASE64URL=Y2ktcnVudGltZS1uZXh0' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_1_STATUS=ACTIVE' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_2_NAME_BASE64URL=Y2ktcnVudGltZQ' \
            "$list_file"
          grep -Fqx \
            'AEROTRACE_API_KEY_2_STATUS=REVOKED' \
            "$list_file"

          if grep -Eiq \
            'atr_|secret_hash|(^|_)KEY_ID=' \
            "$list_file" "$revoke_file"; then
            echo 'lifecycle output exposed credential material' >&2
            exit 1
          fi

      - name: Verify first-owner bootstrap invite
        env:
          AEROTRACE_BOOTSTRAP_TENANT_SLUG: aerotrace-ci
          AEROTRACE_BOOTSTRAP_INVITE_EXPIRATION_HOURS: "24"
          AEROTRACE_BOOTSTRAP_INVITE_CONFIRM: ISSUE
        run: |
          set -euo pipefail
          umask 077

          invite_file="$(mktemp)"
          revoke_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$invite_file" "$revoke_file" "$error_file"' EXIT

          bash ./gradlew \
            issueBootstrapInvite \
            --no-daemon \
            >"$invite_file"

          grep -Fqx \
            'AEROTRACE_BOOTSTRAP_INVITE_RESULT=ISSUED' \
            "$invite_file"
          grep -Eq \
            '^AEROTRACE_BOOTSTRAP_INVITE_TENANT_ID=[0-9a-f-]{36}$' \
            "$invite_file"
          grep -Eq \
            '^AEROTRACE_BOOTSTRAP_INVITE_ID=[0-9a-f-]{36}$' \
            "$invite_file"
          grep -Eq \
            '^AEROTRACE_BOOTSTRAP_INVITE_EXPIRES_AT=.+$' \
            "$invite_file"
          grep -Eq \
            '^AEROTRACE_BOOTSTRAP_INVITE=ati_[A-Za-z0-9_-]{43}$' \
            "$invite_file"

          if grep -Eiq \
            'token_hash|secret_hash' \
            "$invite_file" || \
            grep -E '^AEROTRACE_BOOTSTRAP_' \
              "$invite_file" | \
              grep -Eiq 'https?://'; then
            echo 'bootstrap output exposed stored hash or URL material' >&2
            exit 1
          fi

          if bash ./gradlew \
            issueBootstrapInvite \
            --no-daemon \
            >/dev/null \
            2>"$error_file"; then
            echo 'duplicate usable bootstrap invite was unexpectedly issued' >&2
            exit 1
          fi

          grep -Fq \
            'A usable bootstrap invite already exists for the tenant' \
            "$error_file"

          invite_id="$(
            sed -n \
              's/^AEROTRACE_BOOTSTRAP_INVITE_ID=//p' \
              "$invite_file"
          )"

          AEROTRACE_BOOTSTRAP_INVITE_ID="$invite_id" \
          AEROTRACE_BOOTSTRAP_INVITE_CONFIRM=REVOKE \
            bash ./gradlew \
              revokeBootstrapInvite \
              --no-daemon \
              >"$revoke_file"

          grep -Fqx \
            'AEROTRACE_BOOTSTRAP_INVITE_REVOKE_RESULT=REVOKED' \
            "$revoke_file"

          AEROTRACE_BOOTSTRAP_INVITE_ID="$invite_id" \
          AEROTRACE_BOOTSTRAP_INVITE_CONFIRM=REVOKE \
            bash ./gradlew \
              revokeBootstrapInvite \
              --no-daemon \
              >"$revoke_file"

          grep -Fqx \
            'AEROTRACE_BOOTSTRAP_INVITE_REVOKE_RESULT=ALREADY_REVOKED' \
            "$revoke_file"

          if grep -Eiq \
            'ati_[A-Za-z0-9_-]{43}|token_hash' \
            "$revoke_file" || \
            grep -E '^AEROTRACE_BOOTSTRAP_' \
              "$revoke_file" | \
              grep -Eiq 'https?://'; then
            echo 'bootstrap revoke output exposed credential material' >&2
            exit 1
          fi

          echo 'bootstrap_invite_acceptance=PASS'
