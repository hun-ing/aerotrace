name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aerotrace-ci-only
          POSTGRES_DB: aerotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aerotrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AEROTRACE_DB_URL: >-
        jdbc:postgresql://localhost:5432/aerotrace?reWriteBatchedInserts=true
      AEROTRACE_DB_USERNAME: postgres
      AEROTRACE_DB_PASSWORD: aerotrace-ci-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Backend tests
        run: bash ./gradlew test --no-daemon

      - name: Verify Project API Key provisioning
        env:
          AEROTRACE_PROVISION_TENANT_NAME: AeroTrace CI
          AEROTRACE_PROVISION_TENANT_SLUG: aerotrace-ci
          AEROTRACE_PROVISION_PROJECT_NAME: AeroTrace CI
          AEROTRACE_PROVISION_PROJECT_SLUG: aerotrace-ci
          AEROTRACE_PROVISION_API_KEY_NAME: ci-runtime
          AEROTRACE_PROVISION_API_KEY_EXPIRATION_DAYS: "1"
        run: |
          set -euo pipefail
          umask 077

          output_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$output_file" "$error_file"' EXIT

          bash ./gradlew \
            provisionProjectApiKey \
            --no-daemon \
            >"$output_file"

          grep -Eq \
            '^AEROTRACE_PROVISIONED_TENANT_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_PROJECT_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_API_KEY_ID=[0-9a-f-]{36}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_KEY_ID=[A-Za-z0-9_-]{16}$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_EXPIRES_AT=.+$' \
            "$output_file"
          grep -Eq \
            '^AEROTRACE_PROVISIONED_API_KEY=atr_[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{43}$' \
            "$output_file"

          if bash ./gradlew \
            provisionProjectApiKey \
            --no-daemon \
            >/dev/null \
            2>"$error_file"; then
            echo 'duplicate active API Key was unexpectedly issued' >&2
            exit 1
          fi

          grep -Fq \
            'An active API Key already exists with this name: ci-runtime' \
            "$error_file"
