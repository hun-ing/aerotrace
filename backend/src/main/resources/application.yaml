spring:
  application:
    name: aerotrace-backend

  threads:
    virtual:
      enabled: true

  main:
    keep-alive: true

  datasource:
    url: ${AEROTRACE_DB_URL:jdbc:postgresql://localhost:5432/aerotrace?reWriteBatchedInserts=true}
    username: ${AEROTRACE_DB_USERNAME:postgres}
    password: ${AEROTRACE_DB_PASSWORD}

    hikari:
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
      table-name: AEROTRACE_SESSION
      cleanup-cron: "0 * * * * *"

server:
  port: 8080

  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        name: __Host-aerotrace_session
        path: /
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

aerotrace:
  auth:
    enabled: false
    allow-insecure-local: false
    secure-cookie: true
    cookie-name: __Host-aerotrace_session
    public-origin: ""
    success-redirect-path: /
    absolute-session-lifetime: 7d
    allowed-oauth-scopes:
      - read:user
    github:
      client-id: ""
      client-secret: ""

  ingest:
    max-spans-per-request: 5000
    max-request-body-bytes: 10485760
    jdbc:
      batch-size: 1000
