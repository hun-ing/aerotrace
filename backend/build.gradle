plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.huning'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('provisionProjectApiKey', JavaExec) {
    group = 'application'
    description = 'Provision a tenant, project, and Project API Key from environment variables.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.huning.aerotrace.auth.infrastructure.ProjectApiKeyProvisioner'
}

tasks.register('manageProjectApiKeys', JavaExec) {
    group = 'application'
    description = 'List, issue, or revoke Project API Keys from environment variables.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.huning.aerotrace.auth.infrastructure.ProjectApiKeyLifecycleOperator'
}

tasks.register('issueBootstrapInvite', JavaExec) {
    group = 'application'
    description = 'Issue a one-time OWNER bootstrap invite for an existing tenant.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.huning.aerotrace.auth.infrastructure.BootstrapInviteOperator'
}

tasks.register('revokeBootstrapInvite', JavaExec) {
    group = 'application'
    description = 'Revoke an unused operator bootstrap invite by row UUID.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.huning.aerotrace.auth.infrastructure.BootstrapInviteRevocationOperator'
}
